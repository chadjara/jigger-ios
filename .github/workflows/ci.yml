# Pull requests: formula/state tests on Linux (cheap), then an iOS simulator build.
# macOS minutes are billed at 10x on a private repo, so the simulator work depends on the PR:
#   draft PR (quick path):  build + app unit tests (PDF, theme, backup) on iPhone.
#   ready for review / manual run (full gate before merge):  every unit, engine, core and UI test
#   on iPhone, the iPad layout tests, and the iPhone Duo full-screen and keyboard tests.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "reference/**"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_VERSION: "27.1"   # iOS 27.1 SDK: runs full screen on iPhone Duo
  XCODEGEN_VERSION: "2.47.0"

jobs:
  core:
    name: Engine & core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Run JiggerKit tests
        run: swift test --package-path Packages/JiggerKit

  ios:
    name: iOS build & tests (simulator)
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      FULL: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Cache XcodeGen
        uses: actions/cache@v5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"   # a slow cache gives up quickly; XcodeGen is then downloaded
        with:
          path: ~/.xcodegen
          key: xcodegen-${{ env.XCODEGEN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install XcodeGen
        run: .github/scripts/install-xcodegen.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulators
        run: |
          echo "IPHONE_UDID=$(.github/scripts/pick-simulator.sh iPhone)" >> "$GITHUB_ENV"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Jigger.xcodeproj -scheme Jigger \
            -destination "id=$IPHONE_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Quick tests on iPhone simulator (app unit tests; draft PR)
        if: env.FULL != 'true'
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Jigger.xcodeproj -scheme Jigger \
            -destination "id=$IPHONE_UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath results/iPhone.xcresult \
            -only-testing:JiggerTests \
            -parallel-testing-enabled NO \
            -quiet

      - name: Test on iPhone simulator (unit, engine, core and UI tests)
        if: env.FULL == 'true'
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Jigger.xcodeproj -scheme Jigger \
            -destination "id=$IPHONE_UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath results/iPhone.xcresult \
            -parallel-testing-enabled NO \
            -quiet

      - name: Test counts
        if: always()
        run: |
          .github/scripts/test-summary.sh "iPhone" results/iPhone.xcresult
          if [ "$FULL" != "true" ]; then
            echo "### Draft PR: quick path (UI, iPad and iPhone Duo tests run once the PR is marked ready for review)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: results/
          retention-days: 7

  devices:
    # iPad and iPhone Duo run on their own machine, in parallel with the iPhone job, so no runner has to
    # host more than its own simulators. Skipped on draft PRs (quick path).
    name: iPad & iPhone Duo tests (simulator)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Pick the simulators and start booting the iPad
        run: |
          IPAD="$(.github/scripts/pick-simulator.sh iPad)"
          DUO="$(.github/scripts/pick-simulator.sh "iPhone Duo")"
          echo "IPAD_UDID=$IPAD" >> "$GITHUB_ENV"
          echo "DUO_UDID=$DUO" >> "$GITHUB_ENV"
          # A device's first boot is slow; the iPad boots while the app builds. Only one simulator runs at a
          # time, so the two never compete for this machine.
          xcrun simctl boot "$IPAD" || true

      - name: Cache XcodeGen
        uses: actions/cache@v5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"   # a slow cache gives up quickly; XcodeGen is then downloaded
        with:
          path: ~/.xcodegen
          key: xcodegen-${{ env.XCODEGEN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install XcodeGen
        run: .github/scripts/install-xcodegen.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Jigger.xcodeproj -scheme Jigger \
            -destination "id=$IPAD_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Wait for the iPad simulator to finish booting
        run: xcrun simctl bootstatus "$IPAD_UDID" -b

      - name: Test on iPad simulator (sidebar layout)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Jigger.xcodeproj -scheme Jigger \
            -destination "id=$IPAD_UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath results/iPad.xcresult \
            -only-testing:JiggerUITests/JiggerUITests/testIPadShowsSidebarAndSummaryBesideTheCalculator \
            -only-testing:JiggerUITests/JiggerUITests/testAppFillsTheScreenAndTheKeyboardLinesUp \
            -only-testing:JiggerUITests/JiggerUITests/testNumberFieldsUseANumberKeyboard \
            -only-testing:JiggerUITests/JiggerUITests/testAddAnIngredientInMyIngredients \
            -parallel-testing-enabled NO \
            -quiet

      - name: Swap to the iPhone Duo simulator
        if: ${{ !cancelled() }}   # Duo results are useful even when an iPad test fails
        run: |
          xcrun simctl shutdown "$IPAD_UDID" || true
          xcrun simctl boot "$DUO_UDID" || true
          xcrun simctl bootstatus "$DUO_UDID" -b

      - name: Test on iPhone Duo simulator (full screen, keyboard, editor)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Jigger.xcodeproj -scheme Jigger \
            -destination "id=$DUO_UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath results/Duo.xcresult \
            -only-testing:JiggerUITests/JiggerUITests/testAppFillsTheScreenAndTheKeyboardLinesUp \
            -only-testing:JiggerUITests/JiggerUITests/testFirstLaunchShowsTheMargaritaExampleWithCorrectTotals \
            -only-testing:JiggerUITests/JiggerUITests/testNumberFieldsUseANumberKeyboard \
            -only-testing:JiggerUITests/JiggerUITests/testKeyboardCanBeClosedOnMix \
            -only-testing:JiggerUITests/JiggerUITests/testKeyboardCanBeClosedOnSettings \
            -only-testing:JiggerUITests/JiggerUITests/testAddAnIngredientInMyIngredients \
            -parallel-testing-enabled NO \
            -quiet

      - name: Test counts
        if: always()
        run: |
          .github/scripts/test-summary.sh "iPad" results/iPad.xcresult
          .github/scripts/test-summary.sh "iPhone Duo" results/Duo.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: device-test-results
          path: results/
          retention-days: 7
